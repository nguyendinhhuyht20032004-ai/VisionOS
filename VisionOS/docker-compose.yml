# -------------------------------------------------
# docker-compose.yml – VisionOS stack
# -------------------------------------------------
services:
  # -------------------------------------------------
  # AI Service (FastAPI + YOLO + Supervision) + Qdrant
  # -------------------------------------------------
  api:
    build:
      context: .
      args:
        TORCH_CUDA: cpu          # đổi 'cu121' để build bản GPU
    ports:
      - "8000:8000"               # Control API (cũng dùng cho UI cũ)
    environment:
      - QDRANT_URL=http://qdrant:6333
      # Các env cho Control API & Redis (theo AI_SERVICE_INTEGRATION.md)
      - CONTROL_API_PORT=8000
      - REDIS_URL=redis://redis:6379
      - REDIS_STREAM_KEY=VISIONOS_RESULTS
      - RTSP_TRANSPORT=tcp
      - RTSP_RECONNECT_INTERVAL_SEC=5
      - OVERLAY_PUBLISH_FPS=12
      - REDIS_STREAM_MAXLEN=1000
      - SMOOTHER_LEN=2
      - REID_STITCH=0              # tắt ReID khi chạy CPU (tiết kiệm 15-20% CPU)
      - YOLO_WEIGHTS=yolov8s.pt    # small: nhanh hơn nhiều trên CPU, vẫn chính xác tốt
      - YOLO_IMGSZ=640             # 640 bắt tốt vật nhỏ/xa (480 nhanh nhưng bỏ sót)
      - YOLO_CONF=0.2              # hạ ngưỡng → bắt thêm nhiều đối tượng hơn
      - YOLO_HALF=1                # FP16: nhanh hơn ~20% trên Apple Silicon
      - DETECT_EVERY=3             # Tối ưu: chạy YOLO mỗi 3 frame để giữ tốc độ >25fps, chống rớt frame.
    volumes:
      - ./recognition:/app/recognition
      - ./data:/data
    depends_on:
      - qdrant
      - redis
      - mediamtx
    restart: unless-stopped
    # -------------------------------------------------
    # GPU (nếu muốn dùng) – bỏ comment và build với TORCH_CUDA=cu121
    # -------------------------------------------------
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # -------------------------------------------------
  # Qdrant – vector DB (lưu embeddings, events)
  # -------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"               # REST/gRPC + dashboard
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # -------------------------------------------------
  # Redis – stream output (frame result + track events)
  # -------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  # -------------------------------------------------
  # MediaMTX – RTSP server (cung cấp các luồng video)
  # -------------------------------------------------
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx
    ports:
      - "8554:8554"               # RTSP (dùng bởi AI Service)
      - "9997:9997"               # REST API của MediaMTX (không bắt buộc)
    environment:
      - MTX_RTSPSERVER_ADDRESS=:8554
      - MTX_API=yes                         # bật API để tạo/delete path nếu cần
      - MTX_API_KEY=static...oken  # token tĩnh, backend/AI Service sử dụng
    volumes:
      - ./data:/data                       # mount thư mục data/ (video nguồn) vào MediaMTX
    restart: unless-stopped

volumes:
  qdrant_data:

